# BuilderPro "Navy & Sand" login theme.
# Inherits Keycloak's keycloak.v2 templates (PatternFly 5) and only adds CSS, so Keycloak
# upgrades keep working. css/styles.css resolves to the parent's file; ours is layered on top.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/builderpro.css
darkMode=false
